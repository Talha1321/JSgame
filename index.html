<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluppy Bird</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/kaplay.png">
</head>

<body>
        <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.submitForm = function (playerName, score) {
            var formData = {
                playerName: playerName,
                score: score
            };
            $.ajax({
                url: 'submit_score.php',
                method: 'POST',
                data: formData
            })
                .done(function (msg) {
                    console.log("Score Saved: " + msg);
                })
                .fail(function (error) {
                    console.error("Fout bij opslaan:", error);
                });
        };
    </script>

<script type="module" src="game.js"></script>

</body>
</html>
