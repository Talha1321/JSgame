<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fluppy birb</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="icon"
    href="img/kaplay.png"></head>

<body>
  
  <script type="module">
 // main.js
import kaplay from "https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.mjs";
kaplay();
 // virtual:/kaplay.js
    kaplay({
      focus: false,
      font: "happy",
      background: "#4a3052"
    });

    // virtual:/assets.js
    loadSprite("mark", "img/mark.png");
    loadHappy();

    // virtual:/scenes/game.js
    kaplay({ background: [141, 183, 255], font: "happy" });
    loadSprite("bean", "img/bean.png");
    loadBitmapFont("happy", "img/happy.png", 28, 36);
    loadBitmapFont("happy-o", "img/happy-o.png", 36, 45);
    loadSound("score", "mp3/score.mp3");
    loadSound("wooosh", "mp3/woosh.mp3");
    loadSound("hit", "mp3/hit.mp3");
    loadSound("off", "mp3/off.mp3");
    setGravity(1850);
    scene("game", () => {
      const PIPE_OPEN = 225;
      const PIPE_MIN = 25;
      const JUMP_FORCE = 550;
      let SPEED = 300;
      const CEILING = -60;
      const bean = add([
        // sprite() means it's drawn with a sprite of name "bean" (defined above in 'loadSprite')
        sprite("bean"),
        // give it a position
        pos(width() / 10, 0),
        // give it a collider
        area({ isSensor: true }),
        // body component enables it to fall and jump in a gravity enabled world
        body()
      ]);
      bean.onUpdate(() => {
        if (bean.pos.y >= height() || bean.pos.y <= CEILING) {
          play("off");
          go("lose", score);
        }
      });
      onKeyPress("space", () => {
        bean.jump(JUMP_FORCE);
        play("wooosh");
      });
      onGamepadButtonPress("south", () => {
        bean.jump(JUMP_FORCE);
        play("wooosh");
      });
      onMousePress("left", () => {
        bean.jump(JUMP_FORCE);
        play("wooosh");
      });
      let prevPipeH1 = center().y - PIPE_OPEN / 2;
      function spawnPipe() {
        const h1 = prevPipeH1 = (() => {
          const PIPE_MAX = height() - PIPE_MIN - PIPE_OPEN;
          const low = Math.max(PIPE_MIN, prevPipeH1 - PIPE_OPEN * 1.2);
          const high = Math.min(PIPE_MAX, prevPipeH1 + PIPE_OPEN * 1.2);
          return rand(low, high);
        })();
        const h2 = height() - h1 - PIPE_OPEN;
        const makePipe = (posY, h) => [
          pos(width(), posY),
          rect(64, h),
          color(0, 127, 255),
          outline(4),
          area({ isSensor: true }),
          move(LEFT, SPEED),
          offscreen({ destroy: true }),
          // give it a tag for easier behavior assignment later on
          "pipe"
        ];
        add(makePipe(0, h1));
        add([
          // we can spread comps to a new array to also add custom comps
          ...makePipe(h1 + PIPE_OPEN, h2),
          // raw obj just assigns every field to the game obj
          { passed: false }
        ]);
      }
      function addSpeed() {
        SPEED += 1;
      }
      bean.onCollide("pipe", () => {
        go("lose", score);
        play("hit");
        addKaboom(bean.pos);
      });
      onUpdate("pipe", (p) => {
        if (p.pos.x + p.width <= bean.pos.x && p.passed === false) {
          addScore();
          p.passed = true;
        }
      });
      loop(0.8, spawnPipe);
      loop(0.05, addSpeed);
      let score = 0;
      const scoreLabel = add([
        text(score.toString(), { font: "happy-o", size: 45 }),
        anchor("center"),
        pos(width() / 2, 80),
        fixed(),
        z(1e3)
      ]);
      function addScore() {
        score++;
        scoreLabel.text = score.toString();
        play("score");
      }
    });
    scene("lose", (score) => {
      add([
        sprite("bean"),
        pos(width() / 2, height() / 2 - 108),
        scale(3),
        anchor("center")
      ]);
      add([
        text(score, { font: "happy-o" }),
        pos(width() / 2, height() / 2 + 108),
        scale(3),
        anchor("center")
      ]);
      wait(0.2, () => {
        onKeyPress("space", () => go("game"));
        onMousePress(() => go("game"));
      });
    });
    onLoad(() => go("game"));

    // virtual:/main.js
    go("game");

  </script>

<script>
    window.submitForm = function(playerName, score) {
        var formData = {
            playerName: playerName,
            score: score,
        };
        $.ajax({
            url: 'submit_score.php',
            method: 'POST',
            data: formData
        })
        .done(function(msg) {
            alert("Score Saved: " + msg);
        })
        .fail(function(error) {
            console.error("Fout bij opslaan:", error);
        });
    };
</script>

</body>

</html>
